<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BREAD C2 - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-card">
        <h3>🍞 BREAD C2</h3>
        <p class="text-muted">Login to Control Panel</p>
        <form id="loginForm" method="POST" action="#">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" id="username" value="admin" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" id="password" value="BreadRAT2025!" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        <div id="errorMsg" class="text-danger mt-2"></div>
    </div>
    <script>
        // 🔥 URL BACKEND RAILWAY
        const API_BASE = 'https://project-production-82c9.up.railway.app';

        // 🔥 TIDAK ADA AUTO-REDIRECT DI SINI
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username || !password) {
                document.getElementById('errorMsg').innerText = 'Username dan password wajib diisi';
                return;
            }

            try {
                console.log('🔹 Sending login request to:', API_BASE + '/api/auth/login');
                const res = await fetch(API_BASE + '/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                console.log('🔹 Response status:', res.status);
                const data = await res.json();
                console.log('🔹 Response data:', data);

                if (res.ok && data.token) {
                    console.log('✅ Login success, token:', data.token);
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('api_base', API_BASE);
                    console.log('🔹 Token stored, redirecting with replace...');
                    // 🔥 GUNAKAN replace() UNTUK MENGHINDARI HISTORY LOOP
                    window.location.replace('dashboard.html');
                } else {
                    console.log('❌ Login failed. res.ok:', res.ok, 'data.token:', data.token);
                    document.getElementById('errorMsg').innerText = data.error || 'Login failed (check console)';
                }
            } catch (err) {
                console.error('🔥 Fetch error:', err);
                document.getElementById('errorMsg').innerText = 'Network error: ' + err.message;
            }
        });
    </script>
</body>
</html>
