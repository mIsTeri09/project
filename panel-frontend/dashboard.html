<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BREAD C2 - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar">
                <h4 class="text-glow"><i class="bi bi-cpu"></i> BREAD C2</h4>
                <nav class="nav flex-column">
                    <a class="nav-link active" href="dashboard.html"><i class="bi bi-grid"></i> Dashboard</a>
                    <a class="nav-link" href="target.html"><i class="bi bi-phone"></i> Targets</a>
                    <a class="nav-link" href="#"><i class="bi bi-terminal"></i> Commands</a>
                    <a class="nav-link" href="#"><i class="bi bi-file-earmark-text"></i> Logs</a>
                    <a class="nav-link" href="#"><i class="bi bi-gear"></i> Settings</a>
                    <hr style="border-color:#1f2a3a;">
                    <a class="nav-link text-danger" href="#" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</a>
                </nav>
            </div>
            <div class="col-md-10 p-4">
                <h3><i class="bi bi-activity text-glow"></i> Control Dashboard</h3>
                <div class="row g-3 mb-4">
                    <div class="col-md-3"><div class="stat-card"><span>Total Targets</span><div class="stat-value" id="totalTargets">0</div></div></div>
                    <div class="col-md-3"><div class="stat-card"><span>Online</span><div class="stat-value text-success" id="onlineTargets">0</div></div></div>
                    <div class="col-md-3"><div class="stat-card"><span>Offline</span><div class="stat-value text-secondary" id="offlineTargets">0</div></div></div>
                    <div class="col-md-3"><div class="stat-card"><span>Commands</span><div class="stat-value text-warning" id="totalCommands">0</div></div></div>
                </div>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <div class="card"><div class="card-header">Activity Chart</div><div class="card-body"><canvas id="activityChart" height="150"></canvas></div></div>
                    </div>
                    <div class="col-md-6">
                        <div class="card"><div class="card-header">Recent Commands</div><div class="card-body"><div class="terminal" id="recentCommands">[system] Waiting...</div></div></div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header d-flex justify-content-between">
                        <span><i class="bi bi-phone"></i> Target Devices</span>
                        <span><i class="bi bi-arrow-repeat" onclick="loadTargets()"></i></span>
                    </div>
                    <div class="card-body p-0">
                        <table class="table table-dark table-hover mb-0">
                            <thead><tr><th>Device</th><th>UUID</th><th>Model</th><th>Status</th><th>Battery</th><th>Last Seen</th><th>Action</th></tr></thead>
                            <tbody id="targetBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
