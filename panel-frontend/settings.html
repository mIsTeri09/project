<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BREAD C2 - Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar">
                <h4 class="text-glow"><i class="bi bi-cpu"></i> BREAD C2</h4>
                <nav class="nav flex-column">
                    <a class="nav-link" href="panel.html"><i class="bi bi-grid"></i> Dashboard</a>
                    <a class="nav-link" href="target.html"><i class="bi bi-phone"></i> Targets</a>
                    <a class="nav-link" href="commands.html"><i class="bi bi-terminal"></i> Commands</a>
                    <a class="nav-link" href="logs.html"><i class="bi bi-file-earmark-text"></i> Logs</a>
                    <a class="nav-link active" href="settings.html"><i class="bi bi-gear"></i> Settings</a>
                    <hr style="border-color:#1f2a3a;">
                    <a class="nav-link text-danger" href="#" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</a>
                </nav>
            </div>
            <div class="col-md-10 p-4">
                <h3><i class="bi bi-gear text-glow"></i> Settings</h3>
                <div class="card mt-3">
                    <div class="card-body">
                        <h5>Backend URL</h5>
                        <p><code id="currentApiBase">Loading...</code></p>
                        <button class="btn btn-danger" onclick="resetSettings()">Reset to Default</button>
                        <hr>
                        <h5>Account</h5>
                        <p>Login: <strong>admin</strong></p>
                        <button class="btn btn-warning" onclick="changePassword()">Change Password</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="module">
        import { API_BASE } from './js/config.js';
        const token = localStorage.getItem('token');
        if (!token) window.location.replace('index.html');

        window.logout = function() {
            localStorage.removeItem('token');
            localStorage.removeItem('api_base');
            window.location.replace('index.html');
        };

        document.getElementById('currentApiBase').innerText = API_BASE;

        window.resetSettings = function() {
            localStorage.removeItem('api_base');
            alert('Settings reset. Reload the page.');
            location.reload();
        };

        window.changePassword = function() {
            alert('Change password feature coming soon.');
        };
    </script>
</body>
</html>
