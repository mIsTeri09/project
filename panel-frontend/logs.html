<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BREAD C2 - Logs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar">
                <h4 class="text-glow"><i class="bi bi-cpu"></i> BREAD C2</h4>
                <nav class="nav flex-column">
                    <a class="nav-link" href="panel.html"><i class="bi bi-grid"></i> Dashboard</a>
                    <a class="nav-link" href="target.html"><i class="bi bi-phone"></i> Targets</a>
                    <a class="nav-link" href="commands.html"><i class="bi bi-terminal"></i> Commands</a>
                    <a class="nav-link active" href="logs.html"><i class="bi bi-file-earmark-text"></i> Logs</a>
                    <a class="nav-link" href="settings.html"><i class="bi bi-gear"></i> Settings</a>
                    <hr style="border-color:#1f2a3a;">
                    <a class="nav-link text-danger" href="#" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</a>
                </nav>
            </div>
            <div class="col-md-10 p-4">
                <h3><i class="bi bi-file-earmark-text text-glow"></i> Activity Logs</h3>
                <div class="card mt-3">
                    <div class="card-header">All Logs</div>
                    <div class="card-body p-0">
                        <table class="table table-dark table-hover mb-0">
                            <thead><tr><th>Time</th><th>Target</th><th>Type</th><th>Data</th></tr></thead>
                            <tbody id="logBody">
                                <tr><td colspan="4" class="text-center text-muted">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="module">
        import { API_BASE } from './js/config.js';
        const token = localStorage.getItem('token');
        if (!token) window.location.replace('index.html');

        window.logout = function() {
            localStorage.removeItem('token');
            localStorage.removeItem('api_base');
            window.location.replace('index.html');
        };

        async function loadLogs() {
            try {
                // Sementara kita ambil dari target pertama (belum ada endpoint /api/logs/all)
                const res = await fetch(API_BASE + '/api/logs/all', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.status === 401) { logout(); return; }
                const data = await res.json();
                const body = document.getElementById('logBody');
                body.innerHTML = '';
                if (!data || data.length === 0) {
                    body.innerHTML = '<tr><td colspan="4" class="text-center text-muted">No logs found.</td></tr>';
                    return;
                }
                data.forEach(log => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${log.timestamp || 'N/A'}</td>
                        <td><small>${log.target_uuid ? log.target_uuid.substring(0,12) : 'N/A'}</small></td>
                        <td>${log.type}</td>
                        <td><pre style="max-width:250px; overflow:hidden; text-overflow:ellipsis;">${log.data ? JSON.stringify(JSON.parse(log.data || '{}'), null, 2) : '—'}</pre></td>
                    `;
                    body.appendChild(row);
                });
            } catch (e) {
                console.error('Load logs error:', e);
                document.getElementById('logBody').innerHTML = '<tr><td colspan="4" class="text-center text-danger">Failed to load logs.</td></tr>';
            }
        }
        loadLogs();
        setInterval(loadLogs, 10000);
    </script>
</body>
</html>
