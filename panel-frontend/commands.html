<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BREAD C2 - Commands</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar">
                <h4 class="text-glow"><i class="bi bi-cpu"></i> BREAD C2</h4>
                <nav class="nav flex-column">
                    <a class="nav-link" href="panel.html"><i class="bi bi-grid"></i> Dashboard</a>
                    <a class="nav-link" href="target.html"><i class="bi bi-phone"></i> Targets</a>
                    <a class="nav-link active" href="commands.html"><i class="bi bi-terminal"></i> Commands</a>
                    <a class="nav-link" href="logs.html"><i class="bi bi-file-earmark-text"></i> Logs</a>
                    <a class="nav-link" href="builder.html"><i class="bi bi-hammer"></i> APK Builder</a>
                    <a class="nav-link" href="settings.html"><i class="bi bi-gear"></i> Settings</a>
                    <hr style="border-color:#1f2a3a;">
                    <a class="nav-link text-danger" href="#" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</a>
                </nav>
            </div>
            <div class="col-md-10 p-4">
                <h3><i class="bi bi-terminal text-glow"></i> Command History</h3>
                <div class="card mt-3">
                    <div class="card-header">All Commands</div>
                    <div class="card-body p-0">
                        <table class="table table-dark table-hover mb-0">
                            <thead><tr><th>ID</th><th>Target</th><th>Command</th><th>Status</th><th>Created</th><th>Result</th></tr></thead>
                            <tbody id="commandBody">
                                <tr><td colspan="6" class="text-center text-muted">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="module">
        import { API_BASE } from './js/config.js';
        const token = localStorage.getItem('token');
        if (!token) window.location.replace('index.html');

        window.logout = function() {
            localStorage.removeItem('token');
            localStorage.removeItem('api_base');
            window.location.replace('index.html');
        };

        async function loadCommands() {
            try {
                const res = await fetch(API_BASE + '/api/commands?all=true', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.status === 401) { logout(); return; }
                const data = await res.json();
                const body = document.getElementById('commandBody');
                body.innerHTML = '';
                if (!data || data.length === 0) {
                    body.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No commands found.</td></tr>';
                    return;
                }
                data.forEach(cmd => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${cmd.id}</td>
                        <td><small>${cmd.target_uuid ? cmd.target_uuid.substring(0,12) : 'N/A'}</small></td>
                        <td>${cmd.command}</td>
                        <td><span class="badge bg-${cmd.status === 'completed' ? 'success' : cmd.status === 'pending' ? 'warning' : 'secondary'}">${cmd.status}</span></td>
                        <td>${cmd.created_at || 'N/A'}</td>
                        <td><pre style="max-width:200px; overflow:hidden; text-overflow:ellipsis;">${cmd.result ? JSON.stringify(JSON.parse(cmd.result || '{}'), null, 2) : '—'}</pre></td>
                    `;
                    body.appendChild(row);
                });
            } catch (e) {
                console.error('Load commands error:', e);
                document.getElementById('commandBody').innerHTML = '<tr><td colspan="6" class="text-center text-danger">Failed to load commands.</td></tr>';
            }
        }
        loadCommands();
        setInterval(loadCommands, 10000);
    </script>
</body>
</html>
